<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f7f8fa"/>
  <text x="60" y="70" font-family="Arial" font-size="34" font-weight="700">FinTech Lending Control Tower</text>
  <text x="60" y="108" font-family="Arial" font-size="18" fill="#555">Portfolio view • synthetic data • Jan–Jun 2026 • 500 applications</text>

  <g font-family="Arial">
    <rect x="60" y="145" width="285" height="120" rx="14" fill="#ffffff" stroke="#d9dde3"/>
    <text x="85" y="182" font-size="16" fill="#666">APPLICATIONS</text>
    <text x="85" y="232" font-size="38" font-weight="700">500</text>

    <rect x="375" y="145" width="285" height="120" rx="14" fill="#ffffff" stroke="#d9dde3"/>
    <text x="400" y="182" font-size="16" fill="#666">APPROVAL RATE</text>
    <text x="400" y="232" font-size="38" font-weight="700">30.4%</text>

    <rect x="690" y="145" width="285" height="120" rx="14" fill="#ffffff" stroke="#d9dde3"/>
    <text x="715" y="182" font-size="16" fill="#666">DISBURSEMENT RATE</text>
    <text x="715" y="232" font-size="38" font-weight="700">17.8%</text>

    <rect x="1005" y="145" width="335" height="120" rx="14" fill="#ffffff" stroke="#d9dde3"/>
    <text x="1030" y="182" font-size="16" fill="#666">SLA BREACH RATE</text>
    <text x="1030" y="232" font-size="38" font-weight="700">54.4%</text>
  </g>

  <rect x="60" y="300" width="635" height="255" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <text x="90" y="340" font-family="Arial" font-size="22" font-weight="700">Funnel by current stage</text>
  <g font-family="Arial" font-size="15">
    <text x="95" y="380">Lead</text><rect x="170" y="365" width="355" height="24" rx="8" fill="#5c677d"/><text x="540" y="383">78</text>
    <text x="95" y="420">Application</text><rect x="170" y="405" width="455" height="24" rx="8" fill="#5c677d"/><text x="640" y="423">101</text>
    <text x="95" y="460">Documents</text><rect x="170" y="445" width="325" height="24" rx="8" fill="#5c677d"/><text x="510" y="463">72</text>
    <text x="95" y="500">Credit Review</text><rect x="170" y="485" width="420" height="24" rx="8" fill="#5c677d"/><text x="605" y="503">93</text>
    <text x="95" y="540">Approved / Disbursed / Rejected</text>
  </g>

  <rect x="735" y="300" width="605" height="255" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <text x="765" y="340" font-family="Arial" font-size="22" font-weight="700">Decision signals</text>
  <g font-family="Arial" font-size="16">
    <text x="765" y="385">• More than half of cases are outside SLA.</text>
    <text x="765" y="425">• Disbursal is materially below approval,</text>
    <text x="782" y="448">indicating post-approval friction or leakage.</text>
    <text x="765" y="488">• Partner and city views should drive exception</text>
    <text x="782" y="511">ownership rather than aggregate reporting.</text>
  </g>

  <rect x="60" y="590" width="1280" height="245" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <text x="90" y="630" font-family="Arial" font-size="22" font-weight="700">Operating workflow</text>
  <g font-family="Arial" font-size="17" text-anchor="middle">
    <rect x="95" y="680" width="190" height="70" rx="12" fill="#eef1f5"/><text x="190" y="722">DETECT</text>
    <text x="302" y="720" font-size="28">→</text>
    <rect x="330" y="680" width="190" height="70" rx="12" fill="#eef1f5"/><text x="425" y="722">DIAGNOSE</text>
    <text x="537" y="720" font-size="28">→</text>
    <rect x="565" y="680" width="190" height="70" rx="12" fill="#eef1f5"/><text x="660" y="722">ASSIGN</text>
    <text x="772" y="720" font-size="28">→</text>
    <rect x="800" y="680" width="190" height="70" rx="12" fill="#eef1f5"/><text x="895" y="722">RESOLVE</text>
    <text x="1007" y="720" font-size="28">→</text>
    <rect x="1035" y="680" width="240" height="70" rx="12" fill="#eef1f5"/><text x="1155" y="722">MEASURE</text>
  </g>
  <text x="90" y="800" font-family="Arial" font-size="15" fill="#666">Designed as a decision system: KPI → diagnosis → owner → action → measurement.</text>
</svg>