function kpi(label,value,trend,icon){return `<div class="kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><strong>${value}</strong><span class="trend">${trend}</span></div>`}
function tag(status){let c="gray";if(/Approved|Sanctioned|Completed|Verified|Accepted/.test(status))c="green";else if(/Pending|Review|Due|High|Overdue|Required|Received/.test(status))c="amber";else if(/Reject|Expired|Not viable/.test(status))c="red";else if(/Submitted|Assessment|Mapping|Progress/.test(status))c="blue";return `<span class="tag ${c}">${esc(status)}</span>`}
function filteredCases(type="ALL"){return cases.filter(c=>(type==="ALL"||c.type===type)&&(!query||[c.id,c.student,c.owner,c.lender].join(" ").toLowerCase().includes(query.toLowerCase()))&&(role!=="rm"||c.owner==="Riya Shah")&&(role!=="student"||c.studentId==="STU-1048")&&(role!=="lender"||c.lender==="Credila"))}
function dashboard(){let rows=filteredCases();let funnelData=[["Documents pending",rows.filter(c=>/Documents Pending/.test(c.stage)).length,rows.length],["Lender assessment",rows.filter(c=>/Assessment|Logged In/.test(c.stage)).length,rows.length],["Sanctioned",rows.filter(c=>/Sanctioned/.test(c.stage)).length,rows.length],["Disbursement",rows.filter(c=>/Disbursement/.test(c.stage)).length,rows.length]];return pageHead("Portfolio snapshot","Business overview","A clear view of application health, lender movement and operational priorities.",'<button class="btn" onclick="showModal(\'newcase\')">＋ New case</button><button class="btn primary" onclick="setPage(\'newloans\')">View pipeline →</button>')+`<div class="rolebanner" style="margin-bottom:14px">Viewing as <b>${roleInfo[role].label}</b> · Role-aware sample workspace · All records are synthetic</div><div class="grid kpis">${kpi("Active applications",String(rows.length),"Current visible case records","▤")}${kpi("New education loans",String(rows.filter(c=>c.type==="NEW").length),"From visible case records","＋")}${kpi("Balance transfers",String(rows.filter(c=>c.type==="BT").length),"From visible case records","↗")}${kpi("Documents queued",String(docs.filter(d=>d.status!=="Approved"&&(role!=="lender"||people.find(p=>p.name===d.student)?.lender==="Credila")).length),"Pending review or resubmission","▧")}</div><div class="grid two"><section class="panel"><div class="panel-head"><div><h3>Application funnel</h3><div class="muted">Current active cases by operating stage</div></div><button class="btn tiny" onclick="setPage('analytics')">View analytics</button></div><div class="funnel">${funnelData.map(([n,v,t])=>`<div class="funnel-row"><span>${n}</span><div class="track"><div class="fill" style="width:${v/t*100}%"></div></div><strong>${v}</strong></div>`).join("")}</div><div class="legend"><span><i class="dot"></i>Active applications</span><span>Illustrative synthetic numbers</span></div></section><section class="panel"><div class="panel-head"><div><h3>Priority actions</h3><div class="muted">Items that need a human next step</div></div><span class="tag amber">4 open</span></div><div class="tasklist">${tasks.slice(0,4).map(t=>`<div class="task"><span class="bullet"></span><div style="flex:1"><b>${t.title}</b><small>${t.caseId} · ${t.due}</small></div>${tag(t.status)}</div>`).join("")}</div><button class="btn tiny" style="margin-top:8px" onclick="setPage('tasks')">Open task list →</button></section></div><section class="panel tablepanel"><div class="table-head"><div><h3>Recently updated cases</h3><div class="muted">Latest activity across your workspace</div></div><div class="actions"><button class="btn tiny" onclick="setPage('newloans')">All new loans</button><button class="btn tiny" onclick="setPage('bt')">All BT cases</button></div></div>${caseTable(rows.slice(0,5))}</section>`}
function caseTable(rows){if(!rows.length)return '<div class="empty">No cases match your filters.</div>';return `<div class="table-wrap"><table><thead><tr><th>Case / Student</th><th>Journey</th><th>Current stage</th><th>Lender</th><th>Loan amount</th><th>Owner</th><th>Age</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td><div class="person"><div class="mini-avatar">${c.student.split(" ").map(x=>x[0]).join("")}</div><div><b>${c.id}</b><small>${c.student}</small></div></div></td><td>${tag(c.type==="BT"?"Balance transfer":"New loan")}</td><td>${tag(c.stage)}</td><td>${c.lender}</td><td>${money(c.amount)}</td><td>${c.owner}</td><td>${c.tat}d</td><td><button class="btn tiny" onclick="openStudent('${c.studentId}')">Open</button></td></tr>`).join("")}</tbody></table></div>`}
function pipeline(type){let rows=filteredCases(type);let label=type==="BT"?"Balance transfer pipeline":"New education loan pipeline";let stages=type==="BT"?btStages:newStages;let btn='<button class="btn primary" onclick="showModal(\'newcase\')">＋ Create case</button>';return pageHead(type==="BT"?"REFINANCING OPERATIONS":"EDUCATION LOAN ORIGINATION",label,type==="BT"?"Review existing loans, validate savings and coordinate payoff through closure.":"Manage the student journey from lead intake to university disbursement.",btn)+`<div class="panel"><div class="tabs"><button class="${viewMode==="table"?"active":""}" onclick="viewMode='table';render()">☷ Table</button><button class="${viewMode==="board"?"active":""}" onclick="viewMode='board';render()">▦ Kanban board</button></div><div class="toolbar"><input id="caseSearch" placeholder="Search case or student…" value="${esc(query)}" oninput="query=this.value;render()"><select onchange="filterType=this.value;render()"><option value="ALL">All priorities</option><option>High</option><option>Normal</option></select><span class="muted">${rows.length} cases shown</span></div>${viewMode==="table"?caseTable(rows):kanban(rows,stages)}</div>`}
function kanban(rows,stages){let visible=stages.filter((s,i)=>rows.some(c=>c.stage===s)||i===0||i===Math.floor(stages.length/2)||i===stages.length-1);return `<div class="board">${visible.map(s=>`<div class="column"><div class="column-head"><span>${s}</span><span>${rows.filter(c=>c.stage===s).length}</span></div>${rows.filter(c=>c.stage===s).map(c=>`<div class="casecard" onclick="openStudent('${c.studentId}')"><b>${c.student}</b><p>${c.id} · ${c.lender}</p><div class="casefoot"><span>${money(c.amount)}</span>${c.tat}d</div></div>`).join("")||'<div class="muted">No cases</div>'}</div>`).join("")}</div>`}
function openStudent(id){if(role==="partner"||!can("studentdetail"))return;selectedStudent=id;activePage="studentdetail";render()}
function studentPage(){let s=people.find(x=>x.id===selectedStudent)||people[0];let cs=cases.filter(c=>c.studentId===s.id&&(role!=="lender"||c.lender==="Credila"));if(role==="lender"){let app=lenderApplications.find(a=>a.studentId===s.id&&a.lender==="Credila");if(!app)return pageHead("LENDER WORKSPACE","Application not available","This application is outside the current lender representative scope.");return pageHead("LENDER APPLICATION","Assigned application","Credila application details · "+app.id)+'<div class="grid two"><section class="panel"><h3>Permitted applicant details</h3><div class="fields"><div class="field"><label>Student</label><b>'+esc(s.name)+'</b></div><div class="field"><label>Application reference</label><b>'+esc(app.reference)+'</b></div><div class="field"><label>Application status</label><b>'+esc(app.status)+'</b></div><div class="field"><label>Requested amount</label><b>'+money(app.amount)+'</b></div><div class="field"><label>University</label><b>'+esc(s.university)+'</b></div><div class="field"><label>Document checklist</label><b>'+s.documents+' of '+s.required+' approved</b></div></div></section><section class="panel"><h3>Application boundary</h3><p class="muted">This UI demo shows only the Credila application assigned in this synthetic example. Other lender applications, internal notes and commission information are not displayed.</p><span class="tag blue">Scoped demo view</span></section></div>'}return pageHead("STUDENT 360","Student profile", "A complete view of borrower, academic and application context.",'<button class="btn" onclick="setPage(\'students\')">← Back to students</button><button class="btn primary" onclick="showModal(\'task\')">＋ Add follow-up</button>')+`<div class="grid detail-grid"><section class="panel"><div class="profile-hero"><div class="avatar">${s.name.split(" ").map(x=>x[0]).join("")}</div><div style="flex:1"><h2>${s.name}</h2><p>${s.id} · ${s.email} · ${s.phone}</p></div>${tag(s.type==="BT"?"Balance transfer":"New loan")}</div><div class="tabs">${["Overview","Academics","Financials","Applications","Documents","Communication","Audit"].map(t=>`<button class="${activeTab===t?"active":""}" onclick="activeTab='${t}';render()">${t}</button>`).join("")}</div><div class="fields">${studentTab(s,activeTab)}</div></section><div class="grid"><section class="panel"><div class="panel-head"><h3>Linked cases</h3><span class="tag blue">${cs.length} case(s)</span></div>${cs.map(c=>`<div class="task"><div style="flex:1"><b>${c.id}</b><small>${c.lender} · ${money(c.amount)}</small><div style="margin-top:6px">${tag(c.stage)}</div></div><button class="btn tiny" onclick="activePage='${c.type==="BT"?"bt":"newloans"}';render()">View</button></div>`).join("")||'<div class="empty">No linked cases.</div>'}</section><section class="panel"><div class="panel-head"><h3>Document completion</h3>${tag(s.documents===s.required?"Complete":"In progress")}</div><div style="font-size:24px;font-weight:850">${Math.round(s.documents/s.required*100)}%</div><div class="progress"><i style="width:${s.documents/s.required*100}%"></i></div><p class="muted">${s.documents} of ${s.required} required documents approved</p><button class="btn tiny" onclick="setPage('documents')">Open document queue</button></section></div></div>`}
function studentTab(s,t){let data={"Overview":[["Student ID",s.id],["Assigned RM",s.rm],["Journey type",s.type==="BT"?"Balance transfer":"New education loan"],["Current stage",s.stage],["Co-applicant",s.coapp],["Last activity",s.updated]],"Academics":[["University",s.university],["Country",s.country],["Course",s.course],["Intake",s.intake],["Admission status","Offer received"],["Visa status","In progress"]],"Financials":[["Requested amount",money(s.loan)],["CIBIL score",s.cibil],["Existing obligations","₹12,500 / month"],["Co-applicant income","₹95,000 / month"],["Current / offered ROI",s.roi],["Affordability","Within indicative range"]],"Applications":[["Linked case",cases.find(c=>c.studentId===s.id)?.id||"—"],["Lender application count",lenderApplications.filter(a=>a.studentId===s.id).length],["Applications",lenderApplications.filter(a=>a.studentId===s.id).map(a=>a.lender+" · "+a.status+" · "+a.id).join(" | ")||"No lender applications"],["Selected lender",s.lender||"Not selected"],["Application state",s.stage],["Offer validity","30 Nov 2026"]],"Documents":[["Required documents",s.required],["Approved documents",s.documents],["Pending documents",s.required-s.documents],["Latest upload","Today, 10:02 AM"],["Verification owner","Operations"],["Portal access","Active"]],"Communication":[["Preferred channel","WhatsApp"],["Email",s.email],["Last message","Document request reminder"],["Last contacted",s.updated],["Open follow-ups","2"],["Consent","Active · Demo record"]],"Audit":[["Profile created","12 Oct 2026"],["Last profile update",s.updated],["Last updated by",s.rm],["Data environment","Synthetic demo"],["Consent record","CONS-"+s.id.slice(-4)],["Access history","Demo audit events"]]}[t];return data.map(([a,b])=>`<div class="field"><label>${a}</label><b>${b}</b></div>`).join("")}
function students(){let rows=people.filter(s=>!query||[s.name,s.id,s.university].join(" ").toLowerCase().includes(query.toLowerCase()));return pageHead("BORROWER DATABASE","Students","Profiles, co-applicants, education plans and active loan journeys.",'<button class="btn primary" onclick="showModal(\'newstudent\')">＋ Add student</button>')+`<section class="panel tablepanel" style="margin:0"><div class="toolbar"><input placeholder="Search students…" value="${esc(query)}" oninput="query=this.value;render()"><span class="muted">${rows.length} profiles</span></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>University / course</th><th>Intake</th><th>Loan journey</th><th>Requested amount</th><th>RM</th><th>Documents</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><div class="person"><div class="mini-avatar">${s.name.split(" ").map(x=>x[0]).join("")}</div><div><b>${s.name}</b><small>${s.id}</small></div></div></td><td>${s.university}<small style="display:block;color:var(--muted)">${s.course}</small></td><td>${s.intake}</td><td>${tag(s.type==="BT"?"Balance transfer":"New loan")}</td><td>${money(s.loan)}</td><td>${s.rm}</td><td>${s.documents}/${s.required}</td><td><button class="btn tiny" onclick="openStudent('${s.id}')">Student 360</button></td></tr>`).join("")}</tbody></table></div></section>`}
function documents(){let currentStudent=people.find(s=>s.id===activeStudentId)||people[0];let list=docs.filter(d=>(role!=="student"||d.student===currentStudent.name)&&(role!=="lender"||people.find(p=>p.name===d.student)?.lender==="Credila")&&(!query||[d.id,d.student,d.name].join(" ").toLowerCase().includes(query.toLowerCase())));return pageHead("OPERATIONS INBOX","Document verification queue","Review student and co-applicant uploads, request corrections and keep lender checklists current.",'<button class="btn primary" onclick="showModal(\'upload\')">＋ Upload document</button>')+`<div class="grid kpis">${kpi("Awaiting review",String(list.filter(d=>d.status!=="Approved").length),"Pending review or resubmission","▧")}${kpi("Resubmission needed",String(list.filter(d=>d.status==="Resubmission required").length),"From visible records","↻")}${kpi("Approved documents",String(list.filter(d=>d.status==="Approved").length),"From visible records","✓")}${kpi("Average verification TAT","6.2 hrs","↓ 1.1 hours","◷")}</div><section class="panel tablepanel" style="margin:0"><div class="toolbar"><input placeholder="Search document or student…" value="${esc(query)}" oninput="query=this.value;render()"><select><option>All document types</option><option>KYC</option><option>Academic</option><option>Income proof</option><option>Existing loan</option></select></div><div class="table-wrap"><table><thead><tr><th>Document</th><th>Student</th><th>Category</th><th>Uploaded</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(d=>`<tr><td><b>${d.name}</b><small style="display:block;color:var(--muted)">${d.id}</small></td><td>${d.student}</td><td>${d.type}</td><td>${d.date}</td><td>${tag(d.status)}</td><td><button class="btn tiny" onclick="reviewDoc('${d.id}','Approved')">Approve</button> <button class="btn tiny" onclick="reviewDoc('${d.id}','Resubmission required')">Request correction</button></td></tr>`).join("")}</tbody></table></div></section>`}
function reviewDoc(id,status){if(!["admin","ops"].includes(role))return;let d=docs.find(x=>x.id===id);if(d){d.status=status;render()}}
function lenderPage(){return pageHead("PARTNER ECOSYSTEM","Lender directory","Compare partner products, indicative criteria and operational performance.",'<button class="btn primary" onclick="showModal(\'lender\')">＋ Add lender</button>')+`<div class="grid kpis">${kpi("Active lender partners","12","Across 5 countries","▥")}${kpi("Applications in review","146","Across active products","▤")}${kpi("Average approval rate","62.4%","Rolling 90-day view","✓")}${kpi("Average TAT","4.8 days","↓ 0.6 days","◷")}</div><section class="panel tablepanel" style="margin:0"><div class="table-wrap"><table><thead><tr><th>Lender</th><th>Product</th><th>Indicative ROI</th><th>Approval rate</th><th>Average TAT</th><th>Active applications</th><th></th></tr></thead><tbody>${lenders.map(l=>`<tr><td><b>${l.name}</b></td><td>${l.products}</td><td>${l.rate}</td><td>${l.approval}</td><td>${l.tat}</td><td>${l.apps}</td><td><button class="btn tiny" onclick="alert('Illustrative partner profile for '+ '${l.name}')">View profile</button></td></tr>`).join("")}</tbody></table></div><p class="muted" style="padding:0 16px 14px">All lender criteria, ROI bands and performance figures are illustrative demo data, not current lender offers.</p></section>`}
function tasksPage(){return pageHead("WORK QUEUE","Tasks & follow-ups","Clear ownership for the next action across student and lender journeys.",'<button class="btn primary" onclick="showModal(\'task\')">＋ Create task</button>')+`<section class="panel"><div class="tasklist">${tasks.map(t=>`<div class="task"><span class="bullet"></span><div style="flex:1"><b>${t.title}</b><small>${t.caseId} · ${t.owner} · ${t.due}</small></div>${tag(t.status)}<button class="btn tiny" onclick="this.closest('.task').remove()">Complete</button></div>`).join("")}</div></section>`}
function analytics(){let rows=filteredCases();let newCount=rows.filter(c=>c.type==="NEW").length;let btCount=rows.filter(c=>c.type==="BT").length;let docCount=docs.filter(d=>d.status!=="Approved"&&(role!=="lender"||people.find(p=>p.name===d.student)?.lender==="Credila")).length;return pageHead("DECISION DASHBOARDS","Portfolio analytics","Conversion, ageing, lender outcomes and operational quality. Sample values are illustrative.",'<button class="btn" onclick="exportSampleReport()">Export sample report</button>')+`<div class="grid kpis">${kpi("New education loans",String(newCount),"Current case records","＋")}${kpi("Balance transfers",String(btCount),"Current case records","↗")}${kpi("Documents needing action",String(docCount),"Pending review or resubmission","▧")}${kpi("Total active cases",String(rows.length),"Current visible case records","▤")}</div><div class="grid two"><section class="panel"><h3>Lender approval scorecard</h3><div class="funnel" style="margin-top:15px">${lenders.map(l=>`<div class="funnel-row"><span>${l.name}</span><div class="track"><div class="fill" style="width:${parseInt(l.approval)}%"></div></div><strong>${l.approval}</strong></div>`).join("")}</div></section><section class="panel"><h3>Operational quality</h3><div class="tasklist">${[["Document first-pass rate","78.6%"],["Average verification TAT","6.2 hrs"],["Open lender queries","23"],["Cases at SLA risk","11"],["BT savings validated","₹1.8 Cr"]].map(([a,b])=>`<div class="task"><b style="flex:1">${a}</b><strong>${b}</strong></div>`).join("")}</div></section></div>`}
function exportSampleReport(){if(!can("analytics"))return;const rows=filteredCases();const header="Case ID,Student,Journey,Stage,Lender,Amount,Owner";const lines=rows.map(c=>[c.id,c.student,c.type,c.stage,c.lender,c.amount,c.owner].join(","));const blob=new Blob([header+"\n"+lines.join("\n")],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="tranche-permitted-sample-report.csv";a.click();URL.revokeObjectURL(url)}
function settings(){return pageHead("ADMINISTRATION","Access & audit controls","Manage role boundaries, demo permissions and operational configuration.",'<button class="btn" onclick="alert(\'Demo settings are read-only in this prototype.\')">Configuration</button>')+`<div class="grid two"><section class="panel"><h3>Role access matrix</h3><div class="tasklist">${[["Admin","All workspaces · user and permission management"],["Relationship Manager","Assigned and team cases · student communication"],["Operations","Documents · lender submissions · disbursement"],["Lender / Partner Manager","Lender products · partner outcomes · turnaround time"],["Student","Own profile · own documents · own status"],["Lender representative","Assigned applications · consented fields only"]].map(([a,b])=>`<div class="task"><div style="flex:1"><b>${a}</b><small>${b}</small></div>${tag("Restricted access")}</div>`).join("")}</div></section><section class="panel"><h3>Recent audit events</h3><div class="tasklist">${[["10:42 AM","Aarav Sharma profile viewed","Riya Shah"],["10:18 AM","Foreclosure letter approved","Devika Nair"],["Yesterday","Case TR-N-2079 sanctioned","System demo"],["Yesterday","Student consent recorded","Aarav Sharma"]].map(([a,b,c])=>`<div class="task"><div style="flex:1"><b>${b}</b><small>${a} · ${c}</small></div>${tag("Logged")}</div>`).join("")}</div></section></div><div class="notice" style="margin-top:14px">This static prototype demonstrates UI-level role boundaries only. It has no authenticated backend, database row-level security or server-side export policy. No commission dataset is included in this public demo. Production access control must be enforced by authenticated APIs and database policies, with automated tests for detail views, analytics and exports.</div>`}
function newCaseModal(){return modal("Create a new case",`<div class="formgrid"><div class="formfield"><label>Student</label><select id="mStudent">${people.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select></div><div class="formfield"><label>Journey type</label><select id="mType"><option value="NEW">New education loan</option><option value="BT">Balance transfer</option></select></div><div class="formfield"><label>Requested amount (₹)</label><input id="mAmount" type="number" value="3500000"></div><div class="formfield"><label>Assigned owner</label><select id="mOwner"><option>Riya Shah</option><option>Karan Patel</option><option>Devika Nair</option></select></div></div>`,()=>{let s=people.find(x=>x.id===document.getElementById("mStudent").value);let type=document.getElementById("mType").value;let id="TR-"+(type==="BT"?"B":"N")+"-"+(2100+cases.length);cases.unshift({id,student:s.name,studentId:s.id,type,stage:type==="BT"?"Existing Loan Review":"Lead Received",owner:document.getElementById("mOwner").value,lender:"—",amount:+document.getElementById("mAmount").value||3500000,tat:0,priority:"Normal"});render()})}
function modal(title,body,onSave){return `<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveModal">Save</button></div></div></div>`}
function showModal(type){if(["lender","partner"].includes(role)&&type!=="referral")return;if(role==="student"&&type!=="referral")return;let root=document.getElementById("modalRoot");if(type==="newcase"){root.innerHTML=newCaseModal();document.getElementById("saveModal").onclick=()=>{let fn=document.getElementById("saveModal");fn.disabled=true;let s=document.getElementById("mStudent");let type=document.getElementById("mType").value;let person=people.find(p=>p.id===s.value);cases.unshift({id:"TR-"+(type==="BT"?"B":"N")+"-"+(2100+cases.length),student:person.name,studentId:person.id,type,stage:type==="BT"?"Existing Loan Review":"Lead Received",owner:document.getElementById("mOwner").value,lender:"—",amount:+document.getElementById("mAmount").value,tat:0,priority:"Normal"});closeModal();render()};return}
let titleMap={newstudent:"Add student profile",upload:"Upload document",task:"Create follow-up task",lender:"Add lender partner",referral:"Refer a friend"};
let body=type==="referral"?'<div class="formgrid"><div class="formfield"><label>Friend’s full name</label><input id="refName" placeholder="Enter their name"></div><div class="formfield"><label>Phone number</label><input id="refPhone" type="tel" placeholder="10-digit mobile number"></div><div class="formfield" style="grid-column:1/-1"><label>University / destination</label><input id="refUni" placeholder="University and country"></div><div class="formfield" style="grid-column:1/-1"><small class="muted">Please share your friend’s details only if they have agreed to be contacted. This demo does not send their information anywhere.</small></div></div>':type==="newstudent"?'<div class="formgrid"><div class="formfield"><label>Full name</label><input id="fName" placeholder="Student name"></div><div class="formfield"><label>Email</label><input id="fEmail" type="email" placeholder="student@example.test"></div><div class="formfield"><label>University</label><input id="fUni" placeholder="University name"></div><div class="formfield"><label>Intake</label><input id="fIntake" placeholder="Fall 2027"></div></div>':type==="upload"?'<div class="formgrid"><div class="formfield"><label>Student</label><select id="fStudent">'+people.filter(s=>role!=="student"||s.id===activeStudentId).map(s=>'<option>'+s.name+'</option>').join("")+'</select></div><div class="formfield"><label>Document type</label><select id="fDoc"><option>KYC</option><option>Academic</option><option>Income proof</option><option>Existing loan</option><option>Foreclosure / payoff</option></select></div><div class="formfield" style="grid-column:1/-1"><label>Document name</label><input id="fDocName" placeholder="e.g. Latest bank statement"></div><div class="formfield" style="grid-column:1/-1"><label>Choose file (demo only)</label><input type="file" id="fFile"><small class="muted">The selected file is not uploaded to a server in this prototype.</small></div></div>':type==="task"?'<div class="formgrid"><div class="formfield" style="grid-column:1/-1"><label>Task</label><input id="fTask" placeholder="Describe the next action"></div><div class="formfield"><label>Case reference</label><select id="fCase">'+cases.map(c=>'<option>'+c.id+'</option>').join("")+'</select></div><div class="formfield"><label>Owner</label><select id="fOwner"><option>Riya Shah</option><option>Karan Patel</option><option>Operations</option></select></div></div>':'<div class="formgrid"><div class="formfield"><label>Lender name</label><input id="fLender" placeholder="Lender name"></div><div class="formfield"><label>Product</label><input id="fProduct" placeholder="Education loan"></div></div>';
root.innerHTML=modal(titleMap[type],body,()=>{});document.getElementById("saveModal").onclick=()=>{if(type==="referral"){let n=document.getElementById("refName").value.trim(),p=document.getElementById("refPhone").value.trim();if(!n||!p)return alert("Enter your friend’s name and phone number.");alert("Referral captured in this demo. The ₹5,000 processing-fee benefit is illustrative and subject to eligibility and offer terms.");}else if(type==="newstudent"){let n=document.getElementById("fName").value.trim();if(!n)return alert("Enter a student name");people.unshift({id:"STU-"+(1050+people.length),name:n,email:document.getElementById("fEmail").value,phone:"—",university:document.getElementById("fUni").value,country:"—",course:"—",intake:document.getElementById("fIntake").value,rm:roleInfo[role].name,loan:0,stage:"Lead Received",type:"NEW",coapp:"Not added",cibil:"—",documents:0,required:8,roi:"—",updated:"Just now"})}else if(type==="upload"){docs.unshift({id:"DOC-"+(9010+docs.length),student:document.getElementById("fStudent").value,name:document.getElementById("fDocName").value||document.getElementById("fDoc").value,type:document.getElementById("fDoc").value,status:"Pending review",date:"Just now"})}else if(type==="task"){tasks.unshift({title:document.getElementById("fTask").value,caseId:document.getElementById("fCase").value,owner:document.getElementById("fOwner").value,due:"Today · New task",status:"Due today"})}else{lenders.push({name:document.getElementById("fLender").value,products:document.getElementById("fProduct").value,rate:"To be configured",tat:"—",approval:"—",apps:0})}closeModal();render()}}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function render(){const c=document.getElementById("content");const n=document.getElementById("newLoanCount"),b=document.getElementById("btCount"),d=document.getElementById("docQueueCount");if(n)n.textContent=cases.filter(x=>x.type==="NEW").length;if(b)b.textContent=cases.filter(x=>x.type==="BT").length;if(d)d.textContent=docs.filter(x=>x.status!=="Approved"&&(role!=="lender"||people.find(p=>p.name===x.student)?.lender==="Credila")).length;if(!can(activePage))activePage=role==="partner"?"lenders":"overview";document.getElementById("crumb").textContent=({overview:"Business overview",newloans:"New education loans",bt:"Balance transfers",students:"Students",documents:role==="student"?"My documents":"Document verification",lenders:"Lender directory",tasks:"Tasks & follow-ups",analytics:"Portfolio analytics",settings:"Admin & audit",studentdetail:"Student 360"})[activePage]||"Tranche";if(role==="student"&&activePage==="overview"){c.innerHTML=studentHome();return}const pages={overview:dashboard,newloans:()=>pipeline("NEW"),bt:()=>pipeline("BT"),students,studentdetail:studentPage,documents,lenders:lenderPage,tasks:tasksPage,analytics,settings};c.innerHTML=(pages[activePage]||dashboard)()}
function selectStudentProfile(id){activeStudentId=id;selectedStudent=id;render()}
function studentHome(){
const s=people.find(p=>p.id===activeStudentId)||people[0];
const myDocs=docs.filter(d=>d.student===s.name);
const pending=Math.max(0,s.required-s.documents);
const lender=s.lender||"Partner lender";
const status=s.lenderStage||s.stage;
const stages=["Application received","Documents verified","Submitted to lender","Credit assessment","Sanction"];
const done=status==="Sanctioned"?4:status==="Documents Pending"?1:3;
return pageHead("STUDENT PORTAL","Welcome back, "+esc(s.name),"Your personal loan journey, document requests and support team.")+
`<div class="panel" style="margin-bottom:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b style="font-size:12px">Student portal preview</b><div class="muted">Switch profiles to demonstrate different lender journeys</div></div><select class="role-select" style="min-width:230px" aria-label="Preview student profile" onchange="selectStudentProfile(this.value)">${people.slice(0,3).map(p=>`<option value="${p.id}" ${p.id===s.id?"selected":""}>${esc(p.name)} · ${esc(p.lender||"Partner lender")}</option>`).join("")}</select></div>
<div class="grid kpis">${kpi("Application status",esc(status),esc(lender)+" · Live demo view","▤")}${kpi("Requested amount",money(s.loan),"Education loan","₹")}${kpi("Documents approved",s.documents+" of "+s.required,pending+" items need attention","▧")}${kpi("Next update",status==="Sanctioned"?"Offer review":"In progress","Your lender: "+esc(lender),"◷")}</div>
<div class="grid two"><section class="panel"><h3>Your profile & support</h3><div class="tasklist"><div class="task"><div style="flex:1"><b>${esc(s.name)}</b><small>${esc(s.email)} · ${esc(s.phone)}</small></div></div><div class="task"><div style="flex:1"><b>${esc(s.university)}</b><small>${esc(s.course)} · ${esc(s.country)} · ${esc(s.intake)}</small></div></div><div class="task"><div style="flex:1"><b>Your relationship manager</b><small>${esc(s.rm)}</small></div></div><div class="task"><div style="flex:1"><b>Your lender</b><small>${esc(lender)} · ${esc(status)}</small></div></div></div></section>
<section class="panel"><h3>Your application journey</h3><div class="tasklist" style="margin-top:12px">${stages.map((x,i)=>`<div class="task"><span class="bullet" style="background:${i<done?"var(--green)":"#d0d7e2"}"></span><div style="flex:1"><b>${x}</b><small>${i<done?"Completed":i===done?"In progress":"Upcoming"}</small></div>${tag(i<done?"Completed":i===done?"In review":"Upcoming")}</div>`).join("")}</div></section>
<section class="panel"><h3>Documents to complete</h3><div class="tasklist" style="margin-top:12px">${(myDocs.filter(d=>!/Approved/.test(d.status)).slice(0,3).length?myDocs.filter(d=>!/Approved/.test(d.status)).slice(0,3).map(d=>`<div class="task"><div style="flex:1"><b>${esc(d.name)}</b><small>${esc(d.type)} · ${esc(d.date)}</small></div>${tag(d.status)}</div>`).join(""):`<div class="task"><div style="flex:1"><b>No pending demo document requests</b><small>Your checklist is up to date</small></div>${tag("Complete")}</div>`)}</div><button class="btn primary" style="margin-top:12px" onclick="setPage('documents')">View document requests →</button></section>
<section class="panel" style="background:linear-gradient(135deg,#f4f6ff,#fff);border-color:#dfe5ff"><div class="eyebrow">TRANCHE REFERRAL REWARDS</div><h3 style="font-size:16px;margin:7px 0">Know someone planning to study abroad?</h3><p class="muted" style="font-size:11px;line-height:1.6">Refer a friend who needs an education loan and get <b style="color:var(--blue)">₹5,000 off your processing fee</b> when the referral qualifies.</p><button class="btn primary" style="margin-top:8px" onclick="showModal('referral')">Refer someone →</button><div class="muted" style="margin-top:9px">Illustrative referral offer. Eligibility, qualifying milestones and terms apply.</div></section></div>`;
}
function notify(){alert("You have 3 demo notifications: 1 lender query, 1 document resubmission and 1 follow-up due today.")}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)setPage(b.dataset.page)});
document.getElementById("roleSwitch").addEventListener("change",e=>setRole(e.target.value));
document.getElementById("globalSearch").addEventListener("input",e=>{query=e.target.value;if(["newloans","bt","students","documents"].includes(activePage))render();else if(query){activePage="students";setPage("students")}})
document.getElementById("notify").addEventListener("click",notify);
document.getElementById("mobileMenu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
setRole("admin");
</script>
</body></html>
