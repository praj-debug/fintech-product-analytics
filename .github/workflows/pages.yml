name: Deploy Education Loan Tools to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "education-loan-tools/**"
      - "education-loan-calculator/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/education-loan-tools
          cp -R education-loan-tools/* _site/education-loan-tools/
          cp -R education-loan-calculator _site/education-loan-calculator

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
