name: Deploy Education Loan Tools to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "case-studies/**"
      - "docs/**"
      - "education-loan-tools/**"
      - "education-loan-calculator/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          # Publish standalone portfolio case studies alongside the docs-based site.
          mkdir -p _site/case-studies
          cp -R case-studies/. _site/case-studies/
          mkdir -p _site/education-loan-tools
          cp -R education-loan-tools/* _site/education-loan-tools/
          cp -R education-loan-calculator _site/education-loan-calculator

          # Keep GitHub Pages from applying Jekyll processing to static app assets.
          touch _site/.nojekyll

          # Fail the build rather than publish an incomplete portfolio artifact.
          test -s _site/index.html
          test -s _site/tranche/index.html
          test -s _site/tranche/app/index.html
          test -s _site/loan-advisor/index.html
          test -d _site/case-studies
          test -d _site/education-loan-tools
          test -d _site/education-loan-calculator
          echo "Verified key published paths:"
          find _site -maxdepth 3 -type f | sort | head -200

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
